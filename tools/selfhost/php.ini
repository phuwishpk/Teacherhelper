; docs/HOSTING.md §4.1
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 10M
post_max_size = 55M
max_file_uploads = 100
display_errors = Off
expose_php = Off
date.timezone = UTC
opcache.enable = 1
opcache.memory_consumption = 128
; The code is baked into the image, so it never changes while running.
opcache.validate_timestamps = 0
