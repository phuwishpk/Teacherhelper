ServerName eduvision
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # TLS ends at the proxy in front of this container (a tunnel or a reverse
    # proxy on the host), the only client that can reach this port: take the
    # visitor's address and the https flag from its headers, so rate limits
    # are per visitor and generated URLs are https.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # No query strings in the access log: they carry OAuth codes and tickets.
    LogFormat "%a %t \"%m %U %H\" %>s %O %Dus" eduvision
    CustomLog /proc/self/fd/1 eduvision
    ErrorLog /proc/self/fd/2
</VirtualHost>
