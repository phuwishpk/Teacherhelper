# Secret scan for the whole repository (DESIGN §16.1 "(c) secret scanning in
# CI"). The repo is public, and teammates edit docs/ through the GitHub web UI
# where the local pre-commit hook does not run, so this workflow has no path
# filter: every push to main and every pull request is scanned, plus a weekly
# full-history scan. Rules come from .gitleaks.toml (defaults + Google "AQ."
# keys).
name: secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan covers every commit, not only the checkout.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
