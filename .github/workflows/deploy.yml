# Builds everything production needs from main and publishes it on the
# `deploy` branch, the one branch Plesk Git pulls (docs/HOSTING.md §5):
#
#   backend/            the Laravel code as in main
#   backend/vendor/     composer install --no-dev on PHP 8.3 (Plesk cannot run Composer)
#   backend/public/app/ the Flutter web build from tools/build-web.sh
#
# The branch is one orphan commit per build, never merged anywhere, so main
# keeps no build output (CLAUDE.md "never commit the build"). backend/.env and
# storage/ live on the server and are untouched by a deploy.
#
# Runs on every push to main that touches backend/, app/ or the build
# scripts, and by hand from the Actions tab. No secrets: the web build embeds
# the API address and, when the FIREBASE_* repository variables are set, the
# Firebase web config, which is public by design (DESIGN §38.8).
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app/**'
      - 'tools/build-web.sh'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: ctype, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, openssl, pdo_sqlite, pdo_mysql, session, tokenizer, xmlreader, zip, zlib
  FLUTTER_VERSION: 3.44.5
  API_BASE_URL: https://teacherhelper.phuwish.com

permissions:
  contents: write

jobs:
  build:
    name: composer install + flutter build web → branch deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: composer install (production, PHP 8.3 as composer.json pins it)
        working-directory: backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
        working-directory: app

      # Firebase web config from the repository's Actions *variables*
      # (Settings > Secrets and variables > Actions > Variables, DESIGN §38.8,
      # HOSTING §6.5). Unset = the web app runs without Firebase.
      - name: flutter build web for ${{ env.API_BASE_URL }}/app/
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        run: OUT_DIR="$RUNNER_TEMP/web" tools/build-web.sh "$API_BASE_URL"

      - name: Assemble the deploy tree
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deploy"
          mkdir -p "$out"
          rsync -a --exclude tests --exclude .phpunit.cache --exclude '*.log' backend/ "$out/backend/"
          # The Test Lab at /qa lists the tests behind each automated case
          # (DESIGN §39); the deploy tree has no tests/, so index them here.
          php backend/artisan eduvision:qa-index --output="$out/backend/resources/qa/test-index.json"
          rm -rf "$out/backend/public/app"
          cp -R "$RUNNER_TEMP/web/app" "$out/backend/public/app"
          # The top-level ignore file would hide vendor/ and public/app from git;
          # the ones inside storage/ stay so runtime files are never committed.
          rm -f "$out/backend/.gitignore" "$out/backend/.env" "$out/backend/.env.backup"
          git -C . rev-parse HEAD > "$out/DEPLOY-COMMIT.txt"
          du -sh "$out/backend/vendor" "$out/backend/public/app"
          test -f "$out/backend/public/app/.htaccess"
          test -f "$out/backend/vendor/autoload.php"
          test -s "$out/backend/resources/qa/test-index.json"

      - name: Publish to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ${{ runner.temp }}/deploy
          force_orphan: true
          enable_jekyll: true
          commit_message: 'build(deploy): ${{ github.sha }}'
