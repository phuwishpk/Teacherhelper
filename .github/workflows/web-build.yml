# Builds the Flutter web app for production and publishes the result on the
# `web-build` branch, which Plesk Git deploys into backend/public/app
# (docs/HOSTING.md §5 "deploy อัตโนมัติ"). The branch holds build output
# only: one orphan commit per build, never merged anywhere, so main stays
# free of build files (CLAUDE.md "never commit the build").
#
# Runs on every push to main that touches app/ or the build script, and by
# hand from the Actions tab. No secrets: the build embeds the API address only.
name: web-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/build-web.sh'
      - '.github/workflows/web-build.yml'

concurrency:
  group: web-build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.5
  API_BASE_URL: https://teacherhelper.phuwish.com

permissions:
  contents: write

jobs:
  build:
    name: flutter build web → branch web-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
        working-directory: app

      - name: Build for ${{ env.API_BASE_URL }}/app/
        run: OUT_DIR="$RUNNER_TEMP/web" tools/build-web.sh "$API_BASE_URL"

      - name: Publish to the web-build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web-build
          publish_dir: ${{ runner.temp }}/web/app
          force_orphan: true
          enable_jekyll: true
          commit_message: 'build(web): ${{ github.sha }}'
